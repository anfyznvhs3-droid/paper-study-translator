[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-translator"
version = "0.1.0"
description = "Layout-preserving PDF translator for scholarly documents"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
dependencies = [
    "requests",
    "tqdm",
    "tenacity",
    "numpy",
    "huggingface_hub",
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    "pdfminer-six==20250416",
    "pikepdf",
    "fontTools",
    "peewee>=3.17.8",
    "boto3>=1.26.0",
    "rich",
    "pymupdf<1.25.3",
    "babeldoc>=0.3.50",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
