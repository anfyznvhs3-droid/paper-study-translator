[package]
name = "quality-doc-translator-desktop"
version = "0.1.0"
description = "Paper Study Translator: bilingual academic PDFs"
authors = ["Paper Study Translator contributors"]
edition = "2021"
default-run = "qdt-gemini"

[lib]
name = "quality_doc_translator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[[bin]]
name = "qdt-gemini"
path = "src/main.rs"
